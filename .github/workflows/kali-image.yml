name: Build and push Kali image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image contract from manifest
        id: contract
        run: echo "contract=$(jq -r .contract docker/kali/farai-tool-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: docker/kali
          file: docker/kali/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KALI_CONTRACT=${{ steps.contract.outputs.contract }}
          tags: |
            ghcr.io/pajarori/farai-kali:${{ steps.contract.outputs.contract }}
            ghcr.io/pajarori/farai-kali:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
